<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b17">
<title>Samayu Dental Clinic | Interactive Workflow Demo</title>
<style>
:root{--bg:#F4F3EE;--panel:#fff;--ink:#0B1220;--muted:#69756f;--line:#0B1220;--green:#167c55;--green2:#dff5e9;--blue:#245bff;--red:#b42318;--amber:#936300;--shadow:4px 4px 0 var(--line)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#101b17;color:#fff;padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.03em}.brand small{display:block;color:#b8c8bf;font-weight:500;letter-spacing:0;font-size:12px}
a{color:inherit}.back{color:#d8e8df;text-decoration:none;font-size:13px}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 50px}
.intro{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:clamp(26px,5vw,42px);line-height:1.05;letter-spacing:-.045em;margin:0 0 9px}
.sub{color:var(--muted);max-width:720px;margin:0}
.notice{background:#fff8df;border:1px solid #f1df9d;border-radius:4px;padding:11px 14px;color:#634b00;font-size:13px;margin:18px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab,button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}
.tab.active{background:#14251c;color:white;border-color:#14251c}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.cardhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.cardhead h2{font-size:17px;margin:0;letter-spacing:-.02em}.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phone{max-width:460px;margin:auto;background:#e8eee9;padding:14px;min-height:530px}
.wahead{background:#075e45;color:white;padding:12px;border-radius:4px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#d8f5e4;color:#075e45;display:grid;place-items:center;font-weight:900}
.wahead small{display:block;color:#d5eee2;font-size:11px}
.chat{height:310px;overflow:auto;padding:14px 10px;background-color:#e9e4d9;background-image:radial-gradient(#d5d0c5 .7px,transparent .7px);background-size:14px 14px}
.bubble{max-width:86%;padding:9px 11px;border-radius:4px;margin:7px 0;background:white;box-shadow:0 1px 2px #0001;font-size:13px;white-space:pre-wrap}
.bubble.me{margin-left:auto;background:#d9fdd3}.time{font-size:10px;color:#738078;text-align:right;margin-top:3px}
.composer{display:flex;gap:7px;padding:10px;background:#f7f7f7;border-radius:4px}
.composer input{min-width:0;flex:1;border:1px solid #d9dfda;border-radius:4px;padding:10px 13px;font:inherit}
.send{background:#087c5a;color:white;border:0;border-radius:50%;width:42px;height:42px;padding:0}
.controls{padding:16px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
input,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;background:#fff;color:var(--ink);font:inherit}
.primary{background:#167c55;color:#fff;border-color:#167c55}.danger{background:#fff;color:var(--red);border-color:#f0c7c4}.soft{background:#edf2ef}
